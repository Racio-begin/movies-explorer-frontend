<!DOCTYPE html>
<html lang="ru">

	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/movies-explorer-frontend/favicon-gm.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta
			name="description"
			content="SPA-сервис поиска фильмов"
		/>
		<link rel="apple-touch-icon" href="/movies-explorer-frontend/logo192.png" />
		<link rel="manifest" href="/movies-explorer-frontend/manifest.json" />
		<title>Фильмотека</title>
		<!--
			Парный скрипт к public/404.html: восстанавливает исходный путь,
			закодированный 404-страницей в query-строку, до запуска приложения.
		-->
		<script>
			(function (l) {
				if (l.search[1] === '/') {
					var decoded = l.search.slice(1).split('&').map(function (s) {
						return s.replace(/~and~/g, '&');
					}).join('?');
					window.history.replaceState(null, null,
						l.pathname.slice(0, -1) + decoded + l.hash);
				}
			})(window.location);
		</script>
		<script type="module" crossorigin src="/movies-explorer-frontend/assets/index-CvAGpaYQ.js"></script>
		<link rel="stylesheet" crossorigin href="/movies-explorer-frontend/assets/index-CgAZp5dr.css">
	</head>

	<body class="body">
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
	</body>

</html>
