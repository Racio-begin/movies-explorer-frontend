<!DOCTYPE html>
<html lang="ru">

	<head>
		<meta charset="utf-8" />
		<title>Фильмотека</title>
		<!--
			SPA-редирект для GitHub Pages (приём rafgraph/spa-github-pages).
			GitHub Pages отдаёт этот файл на неизвестные пути; скрипт кодирует
			запрошенный путь в query-строку и уходит на index.html, где парный
			скрипт восстанавливает исходный адрес для react-router.
			pathSegmentsToKeep = 1 — сохраняем сегмент /movies-explorer-frontend.
		-->
		<script>
			var pathSegmentsToKeep = 1;
			var l = window.location;
			l.replace(
				l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
				l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
				l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
				(l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
				l.hash
			);
		</script>
	</head>

	<body></body>

</html>
